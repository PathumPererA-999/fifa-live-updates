name: Update FIFA 2026 Live Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-match-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest match scores
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python fetch_scores.py

      - name: Commit match data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "FIFA Live Bot"
          git add data.json
          if git diff --staged --quiet; then
            echo "No match data changes"
          else
            git commit -m "🤖 Match update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

  update-team-data:
    runs-on: ubuntu-latest
    # Run team form update once per day only
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch team form data
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python collect_teams.py

      - name: Commit team data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "FIFA Live Bot"
          git add teams.json
          if git diff --staged --quiet; then
            echo "No team data changes"
          else
            git commit -m "📊 Team form update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
